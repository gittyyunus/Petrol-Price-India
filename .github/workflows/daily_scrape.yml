name: Daily Petrol Price Scrape

on:
  schedule:
    # 1:00 AM UTC is 6:30 AM IST
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/scraper.py

      - name: Verify scrape and DB sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import sys
          from datetime import datetime, timezone, timedelta
          IST = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(IST).date().isoformat()
          from scripts.scraper import get_supabase
          supabase = get_supabase()
          res = supabase.table('prices').select('id', count='exact').eq('date', today).execute()
          count = res.count or 0
          print(f'Verification: {count} price records present for {today}')
          if count == 0:
              print(f'ERROR: No price records found for {today}')
              sys.exit(1)
          "
